[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enable-ai"
version = "0.1.0"
description = "AI enablement orchestration system: Coordinator + Enablement Subagents that produce runnable per-department orchestrators."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Serenia & Co. (fictional)" }]

dependencies = [
    "claude-agent-sdk==0.1.81",
    "anthropic==0.101.0",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "openinference-instrumentation==0.1.50",
    "opentelemetry-sdk==1.41.1",
    "httpx==0.28.1",
    "launchdarkly-server-sdk-ai==0.19.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.12",
    "mypy==2.1.0",
    "types-PyYAML==6.0.12.20260510",
]
ui = [
    "fastapi==0.136.1",
    "uvicorn==0.46.0",
]

[tool.setuptools.packages.find]
include = ["core*", "coordinator*", "enablement_agents*", "orchestrators*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: tests that hit a live LLM (requires ANTHROPIC_API_KEY); skipped by default",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true

# Tests use TypedDicts-as-dicts and stub fixtures intentionally; strict mode
# would fight that pattern with no real type-safety win. Skip mypy on tests
# entirely — they enforce their own correctness via pytest.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
