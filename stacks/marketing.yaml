# Serenia & Co.'s declared marketing tool stack.
# Demand-gen and lifecycle campaigns for wedding inquiries and
# corporate offsites run through this set.
department: marketing
declared_at: 2026-09-23
tools:
  - name: hubspot
    primary_use: crm
    description: Inbound CRM, contact properties, and campaign attribution for event leads
  - name: slack
    primary_use: internal_handoff
    description: Campaign coordination and launch handoff between brand, content, and performance
  - name: klaviyo
    primary_use: email_marketing
    description: Lifecycle email and SMS for wedding inquiries, venue nurture, and post-event follow-up
  - name: marketo
    primary_use: marketing_automation
    description: Lead scoring and multi-step campaigns for corporate offsite and mid-market accounts
